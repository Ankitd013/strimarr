name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Audit tracked publication contents
        run: python scripts/check_publication.py
      - name: Build plugin
        run: dotnet build src/Strimarr/Gelato.csproj -c Release -o dist/build --nologo
      - name: Relay regressions
        run: dotnet run --project tests/Relay/RelayTests.csproj --no-launch-profile
      - name: Frontend regressions
        run: node tests/frontend/metadata-first.cjs
      - name: Configuration regressions
        run: dotnet run --project tests/Configuration/ConfigurationTests.csproj
      - name: Package
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0-rc.1' }}
        run: python scripts/package.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: strimarr-package
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/release-manifest.json
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: strimarr-package
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --draft --prerelease --title "$RELEASE_TAG" --notes "Release candidate. Read README, CHANGELOG, and compatibility limits before installation."
